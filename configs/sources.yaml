# News, official, macro and rumor sources. Every adapter fails gracefully; a broken source is
# recorded in the source-health ledger and never stops a run. robots.txt is checked before fetching.
# reliability: 5 = primary/official, 4 = established financial press, 3 = general press,
#              2 = opinionated/aggregator, 1 = anonymous social media (potentially manipulative).
user_agent: "athex-agent/0.1 (+https://github.com/alexacker-10/athex-agent; paper-trading research)"
