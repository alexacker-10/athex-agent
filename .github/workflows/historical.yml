name: Historical study

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First window start (YYYY-MM-DD)"
        default: "2011-01-01"
      seeds:
        description: "Random-picker seeds per window"
        default: "200"

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ensure price history
        run: python -m athex_agent.runs bootstrap -v
      - name: Run the study
        run: python -m athex_agent.analysis.historical --start "${{ github.event.inputs.start }}" --seeds "${{ github.event.inputs.seeds }}"
      - name: Rebuild dashboard
        run: python -m athex_agent.runs dashboard
      - name: Commit
        run: |
          git config user.name "athex-agent[bot]"
          git config user.email "athex-agent[bot]@users.noreply.github.com"
          git add -A data docs state
          git diff --cached --quiet || git commit -q -m "historical study $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash && git push
