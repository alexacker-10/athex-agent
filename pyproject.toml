[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athex-agent"
version = "0.1.0"
description = "Autonomous LLM paper-trading experiment on the Athens Stock Exchange"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "pandas==3.0.6",
  "numpy==2.5.3",
  "python-dateutil==2.9.0.post0",
  "yfinance==1.7.0",
  "tzdata==2026.4",
  "anthropic==1.7.0",
  "feedparser==6.0.14",
  "beautifulsoup4==4.15.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["athex_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
